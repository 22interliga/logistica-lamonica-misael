<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B2A4A">
<title>Plataforma Logística — Gestão Operacional</title>
<style>
:root{
  --navy:#0B2A4A; --navy2:#12385f; --navy3:#1b4a78;
  --accent:#00A9C7; --accent2:#0ea5c4;
  --bg:#f4f6f9; --card:#ffffff; --line:#e3e8ef; --line2:#eef2f7;
  --ink:#12222f; --muted:#64748b; --muted2:#94a3b8;
  --green:#16a34a; --amber:#f59e0b; --red:#dc2626;
  --green-bg:#e7f6ec; --amber-bg:#fef3e0; --red-bg:#fdeaea;
  --radius:14px; --shadow:0 1px 2px rgba(16,34,47,.06),0 4px 16px rgba(16,34,47,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh}
.sidebar{
  width:250px;background:var(--navy);color:#cdd8e6;flex-shrink:0;
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;
  transition:transform .22s ease;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:40px;height:40px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0067a3);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;flex-shrink:0;letter-spacing:-1px}
.brand b{color:#fff;font-size:15px;line-height:1.15;display:block}
.brand span{font-size:10.5px;color:var(--accent);letter-spacing:1.5px;font-weight:700}
.nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.nav .group{font-size:10.5px;letter-spacing:1.2px;color:#5f7897;text-transform:uppercase;padding:14px 12px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;font-size:13.5px;color:#b9c7d9;margin-bottom:1px}
.nav a .ic{width:20px;text-align:center;font-size:15px;opacity:.9}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:linear-gradient(90deg,rgba(0,169,199,.22),rgba(0,169,199,.05));color:#fff;box-shadow:inset 3px 0 0 var(--accent)}

.main{flex:1;margin-left:250px;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:14px;padding:0 22px;position:sticky;top:0;z-index:30}
.topbar .menu-btn{display:none;background:none;border:none;font-size:22px;color:var(--navy)}
.topbar h1{font-size:16px;margin:0;font-weight:700;color:var(--navy)}
.topbar .sub{font-size:12px;color:var(--muted);margin-left:2px}
.topbar .spacer{flex:1}
.role-select{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;color:var(--ink);font-weight:600}
.userchip{display:flex;align-items:center;gap:9px;padding:5px 6px 5px 10px;border:1px solid var(--line);border-radius:30px}
.userchip .av{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.userchip small{display:block;color:var(--muted);font-size:11px;line-height:1}
.content{padding:24px 26px 60px;max-width:1320px;width:100%}

/* ---------- Reusable ---------- */
.pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pagehead .t h2{margin:0;font-size:21px;color:var(--navy)}
.pagehead .t p{margin:3px 0 0;color:var(--muted);font-size:13px}
.pagehead .spacer{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card h3.sec{margin:0 0 2px;font-size:15px;color:var(--navy)}
.card .seclabel{font-size:11.5px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;gap:16px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--navy3)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--red);border-color:#f3c9c9}
.btn.danger:hover{background:var(--red-bg)}
.iconbtn{border:none;background:none;color:var(--muted);font-size:15px;padding:5px 7px;border-radius:7px}
.iconbtn:hover{background:var(--line2);color:var(--navy)}

/* Stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.stat .val{font-size:30px;font-weight:800;color:var(--navy);margin-top:8px;letter-spacing:-1px}
.stat .foot{font-size:11.5px;color:var(--muted2);margin-top:4px}
.stat .ic{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--line2)}
.stat.warn .val{color:var(--amber)} .stat.alert .val{color:var(--red)}

/* Table */
.tablewrap{overflow-x:auto;border-radius:var(--radius)}
table.data{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.data th{background:var(--navy);color:#dfe9f3;text-align:left;padding:11px 13px;font-weight:600;font-size:12px;white-space:nowrap;letter-spacing:.2px}
table.data th:first-child{border-top-left-radius:var(--radius)}
table.data th:last-child{border-top-right-radius:var(--radius)}
table.data td{padding:11px 13px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.data tr:hover td{background:#fafcff}
table.data tr:last-child td{border-bottom:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:30px;font-size:11.5px;font-weight:700}
.tag.g{background:var(--green-bg);color:var(--green)} .tag.a{background:var(--amber-bg);color:#b45309}
.tag.r{background:var(--red-bg);color:var(--red)} .tag.n{background:#eef2f7;color:var(--muted)}
.tag.b{background:#e6f2fb;color:#0369a1}
.prio-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}

/* Filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters input,.filters select{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;min-width:150px}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--accent)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(11,42,74,.42);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .16s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal header h3{margin:0;font-size:16px;color:var(--navy)}
.modal header .x{margin-left:auto;background:none;border:none;font-size:20px;color:var(--muted)}
.modal .body{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal .body .full{grid-column:1/-1}
.modal footer{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,169,199,.12)}
.field textarea{resize:vertical;min-height:64px}

/* Org chart */
.org{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0}
.org .lvl{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;position:relative;padding:14px 0}
.org .lvl:not(:last-child):after{content:"";width:2px;height:14px;background:var(--line);position:absolute;bottom:-1px;left:50%}
.orgnode{background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:11px;padding:11px 15px;min-width:180px;box-shadow:var(--shadow);text-align:center}
.orgnode .cargo{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);font-weight:700}
.orgnode .nome{font-weight:700;color:var(--navy);margin-top:2px}
.orgnode .meta{font-size:11px;color:var(--muted);margin-top:3px}

/* KPI cards */
.kpigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .name{font-weight:700;color:var(--navy);font-size:13.5px}
.kpi .nums{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px}
.kpi .nums b{font-size:26px;letter-spacing:-1px}
.kpi .nums small{color:var(--muted);font-size:12px}
.kpi .bar{height:8px;border-radius:6px;background:var(--line2);overflow:hidden;margin-top:8px}
.kpi .bar i{display:block;height:100%;border-radius:6px}
.kpi .foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px}

/* Gantt */
.gantt{overflow-x:auto}
.gantt table{border-collapse:collapse;width:100%;min-width:760px}
.gantt th,.gantt td{border-bottom:1px solid var(--line2);padding:8px 10px;font-size:12.5px}
.gantt th{background:var(--navy);color:#dfe9f3;font-weight:600;font-size:11.5px;text-align:center}
.gantt th.left,.gantt td.left{text-align:left}
.gantt .track{position:relative;height:22px}
.gantt .barx{position:absolute;height:16px;top:3px;border-radius:5px;background:linear-gradient(90deg,var(--navy3),var(--accent));display:flex;align-items:center;padding-left:7px;color:#fff;font-size:10.5px;font-weight:700;box-shadow:var(--shadow)}
.gantt .barx.done{background:linear-gradient(90deg,#15803d,var(--green))}
.gantt .barx.late{background:linear-gradient(90deg,#b91c1c,var(--red))}

/* charts */
.chartcard{padding:18px 20px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Visão geral */
.vg-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.infoline{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.infoline:last-child{border:none}
.infoline .k{width:130px;flex-shrink:0;font-weight:700;color:var(--muted);font-size:12px;padding-top:1px}
.infoline .v{flex:1}
.flow{display:flex;gap:0;margin-top:14px;flex-wrap:wrap}
.flow .step{background:var(--navy2);color:#cfe0f0;padding:10px 16px 10px 22px;font-size:12px;font-weight:600;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);margin-right:-10px}
.flow .step:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);padding-left:16px}
.flow .step.active{background:var(--accent);color:#fff}
.progresswrap{background:var(--line2);border-radius:30px;height:14px;overflow:hidden;margin-top:8px}
.progresswrap i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#0067a3);border-radius:30px}

.badge-lvl{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--navy);color:#fff}
.help{font-size:12px;color:var(--muted);background:#f0f6fb;border:1px solid #d9e8f4;border-radius:10px;padding:10px 13px;margin-top:14px}
.empty{text-align:center;color:var(--muted);padding:34px}

@media(max-width:960px){
  .vg-grid{grid-template-columns:1fr}
}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .topbar .menu-btn{display:block}
  .content{padding:18px 14px 60px}
  .modal .body{grid-template-columns:1fr}
  .userchip small{display:none}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
}
</style>
</head>

function id(){return Math.random().toString(36).slice(2,10)}
function load(){ try{const r=localStorage.getItem(DB_KEY); if(r) return JSON.parse(r);}catch(e){} const c=JSON.parse(JSON.stringify(SEED)); save(c); return c; }
function save(d){ try{localStorage.setItem(DB_KEY,JSON.stringify(d));}catch(e){ console.warn("Sem persistência (localStorage indisponível neste modo). Hospede o arquivo para salvar."); } }

function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function money(v){return "R$ "+(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fdate(d){ if(!d) return "—"; const p=String(d).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function statusTag(s){
  const v=(s||"").toLowerCase();
  if(/conclu|confirm|ativ|realizad/.test(v)) return `<span class="tag g">${esc(s)}</span>`;
  if(/andamento|parcial|tenta/.test(v)) return `<span class="tag a">${esc(s)}</span>`;
  if(/pend|atras|parad|inativ|manuten/.test(v)) return `<span class="tag r">${esc(s)}</span>`;
  return `<span class="tag n">${esc(s||"—")}</span>`;
}
function prioTag(p){
  const c=p==="Alta"?"var(--red)":p==="Média"?"var(--amber)":"var(--green)";
  return `<span class="prio-dot" style="background:${c}"></span>${esc(p||"—")}`;
}

/* ============================================================
   SVG mini-charts (offline, sem dependências)
   ============================================================ */
function barChart(data,{w=520,h=200,color="#0B2A4A",fmt=(x)=>x}={}){
  const pad={l:44,r:12,t:12,b:34}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const max=Math.max(1,...data.map(d=>d.v)); const bw=iw/data.length*.62; const gap=iw/data.length;
  let g="";
  for(let i=0;i<=4;i++){const y=pad.t+ih-ih*(i/4);const val=Math.round(max*i/4);
    g+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#eef2f7"/><text x="${pad.l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#94a3b8">${fmt(val)}</text>`;}
  data.forEach((d,i)=>{const bh=ih*(d.v/max);const x=pad.l+gap*i+(gap-bw)/2;const y=pad.t+ih-bh;
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${d.color||color}"><title>${esc(d.l)}: ${fmt(d.v)}</title></rect>`;
    g+=`<text x="${x+bw/2}" y="${h-pad.b+16}" text-anchor="middle" font-size="10" fill="#64748b">${esc(d.l)}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">${g}</svg>`;
}
function lineChart(series,labels,{w=520,h=200}={}){
  const pad={l:44,r:12,t:12,b:28}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const all=series.flatMap(s=>s.data); const max=Math.max(1,...all);
  let g="";
  for(let i=0;i<=4;i++){const y=pad.t+ih-ih*(i/4);g+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#eef2f7"/><text x="${pad.l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#94a3b8">${Math.round(max*i/4)}</text>`;}
  const X=i=>pad.l+(iw/(labels.length-1||1))*i, Y=v=>pad.t+ih-ih*(v/max);
  series.forEach(s=>{const pts=s.data.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
    g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s.data.forEach((v,i)=>g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${s.color}"/>`);});
  labels.forEach((l,i)=>g+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#64748b">${esc(l)}</text>`);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">${g}</svg>`;
}
function donut(pct,color){
  const r=42,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg viewBox="0 0 110 110" width="96" height="96"><circle cx="55" cy="55" r="${r}" fill="none" stroke="#eef2f7" stroke-width="12"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 55 55)"/><text x="55" y="61" text-anchor="middle" font-size="22" font-weight="800" fill="#0B2A4A">${Math.round(pct)}%</text></svg>`;
}

let modalState=null;
function openForm(entKey,record){
  const E=ENTITIES[entKey]; modalState={entKey,editing:record?record.id:null};
  const rec=record||{};
  const fields=E.cols.map(c=>{
    const val=rec[c.k]!==undefined?rec[c.k]:"";
    const wide=c.type==="textarea"||c.wide?' full':'';
    let input;
    if(c.type==="select"){
      const opts=(c.opts||[]).map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?"selected":""}>${esc(c.optLabels?c.optLabels[o]:o)}</option>`).join("");
      input=`<select data-f="${c.k}"><option value="">—</option>${opts}</select>`;
    } else if(c.type==="textarea"){
      input=`<textarea data-f="${c.k}">${esc(val)}</textarea>`;
    } else {
      const t=c.type==="number"?"number":c.type==="date"?"date":"text";
      input=`<input type="${t}" data-f="${c.k}" value="${esc(val)}" ${c.type==="number"?'step="any"':''}>`;
    }
    return `<div class="field${wide}"><label>${c.l}</label>${input}</div>`;
  }).join("");
  document.getElementById("modalRoot").innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <header><h3>${record?"Editar":"Novo"} — ${E.title}</h3><button class="x" onclick="closeModal()">✕</button></header>
        <div class="body">${fields}</div>
        <footer><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveForm()">Salvar</button></footer>
      </div>
    </div>`;
}
function saveForm(){
  const E=ENTITIES[modalState.entKey]; const rec={};
  document.querySelectorAll("#modalRoot [data-f]").forEach(el=>{
    const k=el.dataset.f; const col=E.cols.find(c=>c.k===k);
    let v=el.value;
    if(col&&col.type==="number") v=v===""?0:Number(v);
    if(k==="maiorMelhor") v=(v==="true");
    rec[k]=v;
  });
  const store=DB[E.store];
  if(modalState.editing){ const i=store.findIndex(x=>x.id===modalState.editing); if(i>=0) store[i]={...store[i],...rec}; }
  else { rec.id=id(); store.push(rec); }
  save(DB); closeModal(); router();
}
function delRecord(entKey,rid){
  if(!confirm("Excluir este registro?")) return;
  const E=ENTITIES[entKey]; DB[E.store]=DB[E.store].filter(x=>x.id!==rid); save(DB); router();
}
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; modalState=null; }

/* Generic table renderer */
function renderTable(entKey,list){
  const E=ENTITIES[entKey];
  const cols=E.cols.filter(c=>!c.hideList);
  if(!list.length) return `<div class="card"><div class="empty">Nenhum registro. Clique em “Adicionar”.</div></div>`;
  const head=cols.map(c=>`<th>${c.l}</th>`).join("")+"<th>Ações</th>";
  const rows=list.map(r=>{
    const tds=cols.map(c=>{
      let v=r[c.k];
      if(c.k==="maiorMelhor") v=v?"Maior é melhor":"Menor é melhor";
      else if(c.tag) return `<td>${statusTag(v)}</td>`;
      else if(c.prio) return `<td>${prioTag(v)}</td>`;
      else if(c.fmt) v=c.fmt(v);
      return `<td>${esc(v==null||v===""?"—":v)}</td>`;
    }).join("");
    return `<tr>${tds}<td style="white-space:nowrap">
      <button class="iconbtn" title="Editar" onclick='openForm("${entKey}",${JSON.stringify(r).replace(/'/g,"&#39;")})'>✎</button>
      <button class="iconbtn" title="Excluir" onclick="delRecord('${entKey}','${r.id}')">🗑</button></td>`;
  }).join("");
  return `<div class="card tablewrap"><table class="data"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* --- Simple CRUD pages --- */
function crudPage(entKey,subtitle,filterCfg){
  const E=ENTITIES[entKey];
  let list=[...DB[E.store]];
  const fid="flt_"+entKey;
  const state=window["__flt_"+entKey]||{};
  // apply filters
  (filterCfg||[]).forEach(fc=>{
    const val=state[fc.k];
    if(val) list=list.filter(r=>String(r[fc.k]||"")===val);
  });
  if(state.__q){const q=state.__q.toLowerCase();list=list.filter(r=>Object.values(r).some(x=>String(x).toLowerCase().includes(q)));}

  let filtersHtml="";
  if(filterCfg){
    filtersHtml=`<div class="filters">
      <input placeholder="Buscar..." oninput="setFlt('${entKey}','__q',this.value)" value="${esc(state.__q||"")}">
      ${filterCfg.map(fc=>{
        const opts=[...new Set(DB[E.store].map(r=>r[fc.k]).filter(Boolean))];
        return `<select onchange="setFlt('${entKey}','${fc.k}',this.value)"><option value="">${fc.l}: todos</option>${opts.map(o=>`<option ${state[fc.k]===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
      }).join("")}
    </div>`;
  }
  document.getElementById("view").innerHTML=`
    <div class="pagehead"><div class="t"><h2>${ENTITIES[entKey].title.replace(/ .*/,"")==="Atividade"?"Responsabilidade por Integrante":pageTitleFor(entKey)}</h2><p>${subtitle}</p></div>
      <div class="spacer"></div><button class="btn primary" onclick='openForm("${entKey}")'>+ Adicionar</button></div>
    ${filtersHtml}
    ${renderTable(entKey,list)}`;
}
function pageTitleFor(k){const t={resp:"Responsabilidades",integrantes:"Responsabilidade por Integrante",org:"Estrutura Organizacional"};return t[k]||ENTITIES[k].title;}
function setFlt(entKey,k,v){ window["__flt_"+entKey]=window["__flt_"+entKey]||{}; window["__flt_"+entKey][k]=v; router(); }

/* --- KPIs --- */
function kpiPct(k){
  if(k.maiorMelhor){ return Math.min(100,Math.round((k.atual/(k.meta||1))*100)); }
  // menor é melhor: 100% quando atual<=meta
  if(k.atual<=k.meta) return 100;
  return Math.max(0,Math.round((k.meta/(k.atual||1))*100));
}
function kpiColor(k){ const p=kpiPct(k); return p>=95?"green":p>=75?"amber":"red"; }
ROUTES.kpi=function(){
  const cmap={green:["var(--green)","var(--green-bg)"],amber:["var(--amber)","var(--amber-bg)"],red:["var(--red)","var(--red-bg)"]};
  const cards=DB.kpis.map(k=>{
    const p=kpiPct(k), col=cmap[kpiColor(k)];
    const u=k.unidade&&k.unidade!=="R$"?" "+k.unidade:"";
    const av=(k.unidade==="R$"?"R$ ":"")+Number(k.atual).toLocaleString("pt-BR")+u;
    const mv=(k.unidade==="R$"?"R$ ":"")+Number(k.meta).toLocaleString("pt-BR")+u;
    return `<div class="kpi" style="border-top:3px solid ${col[0]}">
      <div class="name">${esc(k.nome)}</div>
      <div class="nums"><b style="color:${col[0]}">${esc(av)}</b><small>meta ${esc(mv)}</small></div>
      <div class="bar"><i style="width:${p}%;background:${col[0]}"></i></div>
      <div class="foot"><span>${k.maiorMelhor?"Maior é melhor":"Menor é melhor"}</span>
        <span style="color:${col[0]};font-weight:700">${p}%</span></div>
      <div style="text-align:right;margin-top:6px">
        <button class="iconbtn" onclick='openForm("kpi",${JSON.stringify(k).replace(/'/g,"&#39;")})'>✎</button>
        <button class="iconbtn" onclick="delRecord('kpi','${k.id}')">🗑</button></div>
    </div>`;
  }).join("");
  const g=DB.kpis.filter(k=>kpiColor(k)==="green").length,a=DB.kpis.filter(k=>kpiColor(k)==="amber").length,r=DB.kpis.filter(k=>kpiColor(k)==="red").length;
  document.getElementById("view").innerHTML=`
    <div class="pagehead"><div class="t"><h2>Gestão de Indicadores (KPIs)</h2><p>Metas x resultados — máx. recomendado 4 por área</p></div>
      <div class="spacer"></div><button class="btn primary" onclick='openForm("kpi")'>+ Indicador</button></div>
    <div class="card card-pad" style="margin-bottom:16px;display:flex;gap:26px;align-items:center;flex-wrap:wrap">
      <div><b style="font-size:13px;color:var(--navy)">Semáforo de metas</b>
      <div class="legend" style="margin-top:8px">
        <span><i style="background:var(--green)"></i>No alvo (${g})</span>
        <span><i style="background:var(--amber)"></i>Atenção (${a})</span>
        <span><i style="background:var(--red)"></i>Crítico (${r})</span>
      </div></div>
      <div style="flex:1;min-width:180px"><div class="bar" style="height:14px;display:flex;border-radius:8px;overflow:hidden">
        <i style="width:${g/DB.kpis.length*100}%;background:var(--green)"></i>
        <i style="width:${a/DB.kpis.length*100}%;background:var(--amber)"></i>
        <i style="width:${r/DB.kpis.length*100}%;background:var(--red)"></i>
      </div></div>
    </div>
    <div class="kpigrid">${cards}</div>`;
};

/* --- Roadmap (Gantt) --- */
ROUTES.roadmap=function(){
  const items=DB.roadmap;
  const dates=items.flatMap(i=>[i.inicio,i.fim]).filter(Boolean).map(d=>new Date(d));
  const min=new Date(Math.min(...dates)), max=new Date(Math.max(...dates));
  const span=Math.max(1,(max-min));
  const months=[]; let cur=new Date(min.getFullYear(),min.getMonth(),1);
  while(cur<=max){months.push(new Date(cur));cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);}
  const mnames=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const rows=items.map(it=>{
    const s=new Date(it.inicio),e=new Date(it.fim);
    const left=((s-min)/span)*100, width=Math.max(3,((e-s)/span)*100);
    const cls=it.status==="Concluído"?"done":it.status==="Pendente"&&e<new Date()?"late":"";
    return `<tr>
      <td class="left" style="min-width:200px"><b>${esc(it.nome)}</b><br><small style="color:var(--muted)">${esc(it.responsavel)} • ${fdate(it.inicio)}→${fdate(it.fim)}</small></td>
      <td class="left">${statusTag(it.status)}</td>
      <td class="left">${it.percentual}%</td>
      <td style="width:60%"><div class="track"><div class="barx ${cls}" style="left:${left}%;width:${width}%">${it.percentual}%</div></div></td>
      <td class="left" style="white-space:nowrap">
        <button class="iconbtn" onclick='openForm("roadmap",${JSON.stringify(it).replace(/'/g,"&#39;")})'>✎</button>
        <button class="iconbtn" onclick="delRecord('roadmap','${it.id}')">🗑</button></td>
    </tr>`;
  }).join("");
  document.getElementById("view").innerHTML=`
    <div class="pagehead"><div class="t"><h2>Roadmap</h2><p>Cronograma das etapas do ciclo de implantação</p></div>
      <div class="spacer"></div><button class="btn primary" onclick='openForm("roadmap")'>+ Etapa</button></div>
    <div class="card card-pad">
      <div class="legend" style="margin:0 0 12px"><span><i style="background:var(--navy3)"></i>Em andamento</span><span><i style="background:var(--green)"></i>Concluído</span><span><i style="background:var(--red)"></i>Atrasado</span></div>
      <div class="gantt"><table>
        <thead><tr><th class="left">Etapa</th><th class="left">Status</th><th class="left">%</th>
          <th>${months.map(m=>mnames[m.getMonth()]+"/"+String(m.getFullYear()).slice(2)).join("&nbsp;&nbsp;·&nbsp;&nbsp;")}</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="5" class="empty">Sem etapas.</td></tr>'}</tbody>
      </table></div>
    </div>`;
};
